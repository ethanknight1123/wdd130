<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
            <tr>
              <td>James O. Fantone</td>
              <td>The Battle is the Lord's</td>
              <td>BYU Idaho</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>Russel M. Nelson</td>
              <td>Think Celestial!</td>
              <td>Salt Lake Conference Center</td>
              <td>2023</td>
            </tr>
            <tr>
              <td>Brad R. Wilcox</td>
              <td>His grace Is Sufficient.</td>
              <td>BYU</td>
              <td>2011</td>
            </tr>
         </table>


      <form>
        <label for="speaker-name">Speaker:</label>
        <input type="text" id="speaker-name" required>

        <label for="title">Title:</label>
        <input type="text" id="title" required>

        <label for="location">Location:</label>
        <input type="text" id="location" required>

        <label for="year">Year:</label>
        <input type="text" id="year" required maxlength="4">

        <input type="submit" value="Submit">
      </form>  
      </div>
    </main>
  </div>
</body>
</html>
