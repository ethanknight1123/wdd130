<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer {
            background-color: white;
            width: 400px;
            height: 600px;
            border: navy 10px solid;
            border-radius: 25px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 5fr .5fr 7fr 1fr;
        }
        #head_image {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            text-align: center;
            width: 100%;
            height: 80%;
            background-size: 100%;
            background-image: url("images/jesus_feeds_5000.jpeg");
            grid-row: 1;
            grid-column: 1;
            text-align: center;
            align-content: flex-end;
            color: white;
            text-shadow: 2px 2px black ;
            padding-bottom: 30px;
        }
        h3 {
            text-align: center;
        }
        #myForm {
            
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px;
        }
        #closeBtn {
            grid-row: 1;
            grid-column: 1;
            width: 25px;
            height: 25px;
            margin: 15px;
        }
        #checkboxes {
            grid-column: 1/3;
            text-align: center;
            
        }
        #books {
            display: flex;
            flex-flow: row;
            justify-content: space-between;
        }
        #books img {
            width: 19%;
        }
        #pearl-of-great-price {
            border-bottom-right-radius: 15px;
        }
        #book-of-mormon {
            border-bottom-left-radius: 15px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div id="head_image">
        <h1>Daily Feed</h1>
        <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <button type="button" id="closeBtn">X</button>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
            <div id="checkboxes">
                <section>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section>
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section>
                    <button type="submit">Submit</button>
                </section>
            </div>
        </form>
        <div id="books">
            <img src="images/old_testament.webp" id="book-of-mormon">
            <img src="images/new_testament.webp">
            <img src="images/book_of_mormon.webp">
            <img src="images/doctrine_and_covenants.webp">
            <img src="images/pearl_of_great_price.webp" id="pearl-of-great-price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
